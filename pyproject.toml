[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "omi"
version = "0.1.0"
description = "Options market intelligence: archive free public options-market data and serve it to a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "exchange_calendars>=4.5",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "truststore>=0.9",
    "streamlit>=1.37",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
omi = "omi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real public endpoints; run with `pytest -m live`"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
