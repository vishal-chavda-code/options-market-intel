# Copy to config/config.yaml (git-ignored) and edit there.
# Any value can also be overridden with an env var: OMI_<SECTION>__<KEY>,
# e.g. OMI_NETWORK__CA_BUNDLE=C:/certs/corp-root.pem
# Relative paths are resolved against the repo root, not the current directory.
paths:
  data_dir: ./data
  exports_dir: ./exports
  logs_dir: ./logs
network:
  https_proxy: null          # or http://proxy.corp:8080 ; HTTPS_PROXY/HTTP_PROXY/NO_PROXY env vars are also honoured
  http_proxy: null           # defaults to https_proxy when only that one is set
  ca_bundle: null            # path to corporate root CA .pem if SSL inspection
  use_os_truststore: false   # true = trust the Windows/macOS certificate store (often already has the corporate CA)
  user_agent_contact: you@example.com
  connect_timeout_s: 10
  read_timeout_s: 60
  max_attempts: 4
  rate_limits: {default_rps: 1.0, "www.cboe.com": 0.5, "cdn.cboe.com": 1.0}
universe:
  core: [SPX, SPY, QQQ, IWM, VIX]   # OCC underlying symbols (index options have no "_" prefix here)
  extra: []                  # add single names; or point to a local CSV:
  holdings_csv: null         # local-only file of underlyings from the exposure book (never committed)
sources:
  # Ingested (focus: ETF vs single-stock vs index options; see PROJECT_SPEC.md section 0).
  # Order matters: later sources read tables written by earlier ones.
  symbol_directory:    {enabled: true}   # Nasdaq Trader listings: ETF Y/N flag for every US symbol (current only)
  occ_contract_volume: {enabled: true, backfill_start: "2026-09-17"}   # every underlying x root x exchange x expiry x account; OCC keeps ~30 sessions
  occ_symbol_volume:   {enabled: true, top_n: 50, backfill_start: "2024-11-01"}  # call/put x account x exchange, universe + top-N underlyings
  occ_weekly_class:    {enabled: true, classes: [etf, equity, index], backfill_start: "2024-10-25"}
  occ_daily_volume:    {enabled: true, backfill_start: "2024-11-01"}  # market-wide daily totals (one month-to-date file per month)
  cboe_daily:          {enabled: true, backfill_start: "2019-10-07"}  # Cboe-exchange-only Index/ETP/Equity volume, OI, P/C
  # Every listed contract's open interest, volume, quote and greeks (Cboe delayed chains;
  # undocumented endpoint, see PROJECT_SPEC.md 5.4 -- get compliance sign-off). A snapshot of
  # "now": taken only on the session's own evening after snapshot_after_et, never backfilled.
  # ~4,300 requests a night with scope "all" (~75-90 min at 1 req/s on cdn.cboe.com).
  cboe_chains:
    enabled: true
    scope: all                 # all | top_n | universe
    top_n: 500                 # used when scope is top_n
    retention_sessions: 45     # rolling window of chain_eod days kept; older days are deleted
    keep_raw_sessions: 3       # raw JSON is ~10x the Parquet size, so keep only a few days
    snapshot_after_et: "16:15"
    enforce_window: true       # false = allow a snapshot at any time (testing only)
    commit_every: 200
    symbol_overrides: {}       # OCC underlying -> Cboe URL symbol, e.g. {BRKB: BRK.B}
  # Probed but not ingested yet.
  cftc_cot:       {enabled: true,  dataset: gpe5-46if, markets: []}   # fill codes after discovery
  treasury:       {enabled: true}
  fred:           {enabled: true,  api_key_env: FRED_API_KEY, series: [SP500, VIXCLS, DGS3MO, DGS2, DGS10, T10Y2Y, BAMLH0A0HYM2, NFCI]}
  # Off.
  cboe_indices:   {enabled: false, symbols: [VIX, VIX9D, VIX1D, VIX3M, VIX6M, VIX1Y, VVIX, SKEW, VXN, GVZ, OVX]}  # VIX family: not needed
  cfe_futures:    {enabled: false}   # VX futures curve: not needed
  finra_regsho:   {enabled: false}
pipeline:
  daily_catchup_sessions: 5  # `omi daily` also fills any gaps in this many prior sessions
  commit_every: 20           # write tables + ingest log after this many fetches
features:
  expiry_buckets: [0, 7, 30, 90]   # days to expiry: 0DTE, 1-7, 8-30, 31-90, 91+
  windows: {short: 20, medium: 60, long: 252}
  regime: {calm_vix_pct: 30, stressed_vix_pct: 90, inversion_ratio: 1.0}
  gex_sign_convention: dealer_long_calls_short_puts
schedule:
  daily_et: "19:30"
  retry_et: "07:30"
  cot_et: "Fri 16:00"
report:
  template: null             # path to a corporate .pptx (layouts "Title Slide" / "Title Only")
  sessions: 20               # sessions on the activity chart
  top_n: 15                  # rows per ranked table
app:
  refresh_seconds: 300
  intraday_refresh_seconds: 60
